<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#f8f9fa">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <title>Dashboard de Hábitos</title>
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Header exclusivo de PC -->
    <header class="desktop-header">
        <div class="logo">✨ Meus Mini-Hábitos</div>
        <div class="header-icons">
            <button class="icon-btn" id="stats-btn-pc" title="Estatísticas">📈</button>
            <button class="icon-btn" id="theme-btn-pc" title="Modo Escuro">🌙</button>
            <button class="icon-btn" id="settings-btn-pc" title="Configurações">⚙️</button>
        </div>
    </header>

    <div class="app-container">
        <header class="app-header">
            <h1>Mini-Hábitos</h1>
            <p class="subtitle">Seu progresso diário</p>
        </header>
        
        <!-- Barra de progresso -->
        <div class="progress-wrapper">
            <div class="progress-track">
                <div class="progress-fill" id="progressBar"></div>
            </div>
        </div>

        <!-- Grade de hábitos -->
        <div class="habits-list">
            <button class="habit-btn" data-habit="agua">
                <span class="icon">💧</span>
                <span class="text">Beber Água</span>
            </button>
            <button class="habit-btn" data-habit="leitura">
                <span class="icon">📚</span>
                <span class="text">Ler 10 pág.</span>
            </button>
            <button class="habit-btn" data-habit="alongar">
                <span class="icon">🧘‍♂️</span>
                <span class="text">Alongar</span>
            </button>
        </div>

        <div class="actions-container">
            <button id="notify-btn" class="btn-outline">🔔 Ativar Notificações</button>
            <button id="reset-btn" class="btn-secondary">🔄 Zerar o Dia</button>
        </div>
    </div>

    <!-- Footer exclusivo de celular (Navegação em Abas) -->
    <footer class="mobile-footer" id="mobile-footer">
        <button class="nav-btn active" id="home-btn-mobile">
            <span class="icon">🏠</span>
        </button>
        <button class="nav-btn" id="stats-btn-mobile">
            <span class="icon">📈</span>
        </button>
        <button class="nav-btn" id="theme-btn-mobile">
            <span class="icon">🌙</span>
        </button>
        <button class="nav-btn" id="settings-btn-mobile">
            <span class="icon">⚙️</span>
        </button>
        
        <!-- Ícone de instalar só aparece quando está no navegador -->
        <button class="nav-btn install-anim" id="install-icon-btn" style="display: none;">
            <span class="icon">📥</span>
        </button>
    </footer>

    <script src="script.js"></script>
</body>
</html>
